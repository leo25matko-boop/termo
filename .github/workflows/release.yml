name: Legacy Windows 1.0 Electron installer (manual only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish; must match package.json (for example v1.0.0)'
        type: string
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || 'v1.0.0') || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows desktop application
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.tag || 'v1.0.0') || github.ref_name }}
      NODE_VERSION: '24.22.1'

    steps:
      - name: Validate release tag
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '\Av(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z') {
            throw 'Use a stable version tag such as v1.0.0.'
          }
          "tag=$($env:RELEASE_TAG)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Check desktop sources and configure GitHub downloads
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $manifest = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          if (('v' + $manifest.version) -cne $env:RELEASE_TAG) {
            throw "The release tag must match package.json version $($manifest.version)."
          }
          $required = @(
            'desktop\main.cjs', 'desktop\preload.cjs', 'desktop\icon.ico',
            'public\index.html', 'public\app.js', 'public\styles.css',
            'lib\controller.mjs', 'lib\github-release.mjs', 'github.json'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) {
              throw "Required desktop source is missing: $relative"
            }
          }
          Get-ChildItem -LiteralPath 'desktop', 'lib', 'public' -Recurse -File | Where-Object {
            $_.Extension -in @('.js', '.mjs', '.cjs')
          } | ForEach-Object {
            & node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JavaScript: $($_.FullName)" }
          }
          # Repository coordinates only. No token is written into the application.
          $config = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            assetName = 'TermoDom-Windows.zip'
            autoDownloadOnStart = $true
          }
          $config | ConvertTo-Json | Set-Content -LiteralPath 'github.json' -Encoding utf8NoBOM

      - name: Install pinned desktop dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'package-lock.json' -PathType Leaf) {
            & npm ci --no-audit --no-fund
          } else {
            & npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'Installing desktop dependencies failed.' }

      - name: Build and inspect installer and desktop ZIP
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $builder = Join-Path $env:GITHUB_WORKSPACE 'node_modules\.bin\electron-builder.cmd'
          if (-not (Test-Path -LiteralPath $builder -PathType Leaf)) { throw 'electron-builder is missing.' }
          & $builder --win nsis zip --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Building the Windows desktop application failed.' }

          $manifest = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $output = Join-Path $env:GITHUB_WORKSPACE 'release'
          $installer = Join-Path $output ('TermoDom-Setup-' + $manifest.version + '-x64.exe')
          $archive = Join-Path $output 'TermoDom-Windows.zip'
          $checksum = Join-Path $output 'SHA256SUMS.txt'
          foreach ($file in @($installer, $archive)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -lt 1MB) {
              throw "The desktop build artifact is missing or incomplete: $file"
            }
          }
          $stream = [IO.File]::OpenRead($installer)
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
              throw 'The installer is not a Windows executable.'
            }
          } finally { $stream.Dispose() }
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if (-not ($entries | Where-Object { $_ -match '(?:^|/)TermoDom\.exe$' })) {
              throw 'The desktop ZIP is missing TermoDom.exe.'
            }
            if (-not ($entries | Where-Object { $_ -match '(?:^|/)resources/app(?:\.asar|/package\.json)$' })) {
              throw 'The desktop ZIP is missing packaged application resources.'
            }
            if ($entries | Where-Object { $_ -match '(?:^|/)(?:\.git|\.github|downloads)(?:/|$)' }) {
              throw 'The desktop ZIP contains development files or downloaded updates.'
            }
          } finally { $zip.Dispose() }
          $lines = foreach ($file in @($installer, $archive)) {
            (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($file)
          }
          $lines | Set-Content -LiteralPath $checksum -Encoding ascii
          "installer=$installer" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip=$archive" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$checksum" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Built the TermoDom Windows installer and desktop ZIP for $($env:RELEASE_TAG)." | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Publish Windows installer and desktop ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_INSTALLER: ${{ steps.package.outputs.installer }}
          PACKAGE_ZIP: ${{ steps.package.outputs.zip }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # Environment values are passed as arguments, never inserted into shell source.
          & gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $arguments = @(
              'release', 'upload', $env:RELEASE_TAG,
              $env:PACKAGE_INSTALLER, $env:PACKAGE_ZIP, $env:PACKAGE_SHA256,
              '--clobber', '--repo', $env:GH_REPO
            )
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              $env:PACKAGE_INSTALLER, $env:PACKAGE_ZIP, $env:PACKAGE_SHA256,
              '--target', $env:GITHUB_SHA, '--latest', '--generate-notes',
              '--title', ('TermoDom ' + $env:RELEASE_TAG), '--repo', $env:GH_REPO
            )
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Publishing desktop release assets failed.' }
          if ($exists) {
            & gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not mark the desktop release as latest.' }
          }
