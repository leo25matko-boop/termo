name: Native Windows installer

on:
  workflow_dispatch:
  push:
    branches: [mail]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-native.yml'
      - 'scripts/build-camera-engine.ps1'
      - 'scripts/prepare-camera-engine.py'

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore native dependencies
        run: dotnet restore windows/TermoDom.Windows.csproj --runtime win-x64 --configfile windows/NuGet.Config

      - name: Set up Go for private native camera transport
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build and verify private camera transport
        shell: pwsh
        run: ./scripts/build-camera-engine.ps1 -Destination ./windows/camera -SourceDirectory "$env:RUNNER_TEMP/termodom-camera-source"

      - name: Publish self-contained native Windows app
        run: dotnet publish windows/TermoDom.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=false -p:DebugType=None -o windows/publish

      - name: Verify parsers and native controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $PWD 'windows-verification'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $process = Start-Process -FilePath (Join-Path $PWD 'windows/publish/TermoDom.exe') -ArgumentList "--verify-native=$evidence" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Native verification timed out.' }
          if ($process.ExitCode -ne 0) {
            Get-Content windows/publish/native-verification-error.txt -ErrorAction SilentlyContinue
            throw "Native verification failed: $($process.ExitCode)"
          }
          if (-not (Select-String -Path "$evidence/native-smoke.txt" -Pattern 'TERMODOM_WINDOWS_NATIVE_SMOKE_OK' -Quiet)) { throw 'Missing native UI proof.' }
          Copy-Item windows/publish/core-tests.txt "$evidence/core-tests.txt"
          Get-Content "$evidence/core-tests.txt"
          $screens = @(Get-ChildItem -LiteralPath $evidence -Filter '*.png')
          if ($screens.Count -ne 8) { throw 'Expected eight native Windows screens.' }
          Remove-Item -LiteralPath windows/publish/core-tests.txt -Force

      - name: Build per-user EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'The runner must have the official Inno Setup compiler installed.' }
          & $compiler "/DSourceDir=$PWD/windows/publish" "/DOutputPath=$PWD/windows/installer-output" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compile failed.' }
          $installer = 'windows/installer-output/TermoDom-Setup-2.0.0-x64.exe'
          if ((Get-Item -LiteralPath $installer).Length -lt 1000000) { throw 'Installer is incomplete.' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TermoDom-Setup-2.0.0-x64.exe" | Set-Content -LiteralPath windows/installer-output/TermoDom-Windows-2.0.0-SHA256.txt -Encoding ascii
          Compress-Archive -Path windows/publish/* -DestinationPath windows/installer-output/TermoDom-Windows-2.0.0.zip -CompressionLevel Optimal

      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termodom-windows-native-2.0.0
          overwrite: true
          path: windows/installer-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload native Windows verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termodom-windows-native-verification
          overwrite: true
          path: |
            windows-verification/
            windows/publish/native-verification-error.txt
          if-no-files-found: warn
          retention-days: 7
